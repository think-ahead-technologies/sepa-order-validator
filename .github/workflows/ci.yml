# GitHub Actions CI for the SEPA Payment Order Validator.
# build: compile, Spotless check and unit tests. full-test: all tests, with Testcontainers on the runner's Docker.
# image: container image, CycloneDX SBOMs (jar and image) and the Grype vulnerability gate; pushes to ghcr.io on main.
#
# Java comes from mise.toml via mise-action, Gradle from the verified wrapper. Actions are pinned by commit SHA,
# Syft and Grype run as images pinned by tag and digest.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew build
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-test-reports
          path: |
            build/test-results/test/
            build/reports/tests/test/
          if-no-files-found: ignore

  full-test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: ./gradlew fullTest
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-test-reports
          path: |
            build/test-results/fullTest/
            build/reports/tests/fullTest/
          if-no-files-found: ignore

  image:
    needs: full-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: payment-order-validator:ci
      SYFT_IMAGE: anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
      GRYPE_IMAGE: anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: ./gradlew bootJar
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: SBOMs and vulnerability gate
        run: |
          # The scanners run as the runner user; their temp and cache directories live in the work directory.
          work="$RUNNER_TEMP/scan"
          mkdir -p "$work/tmp" "$work/cache" sbom
          scan() {
            docker run --rm --user "$(id -u):$(id -g)" -e TMPDIR=/work/tmp -e XDG_CACHE_HOME=/work/cache \
              -v "$work:/work" -v "$PWD/sbom:/out" -v "$PWD/.grype.yaml:/grype.yaml:ro" "$@"
          }
          unzip -p build/libs/payment-order-validator.jar META-INF/sbom/application.cdx.json > sbom/application.cdx.json
          docker save "$IMAGE" -o "$work/image.tar"
          scan "$SYFT_IMAGE" docker-archive:/work/image.tar -q -o cyclonedx-json=/out/image.cdx.json

          # Full report, including findings without a fix and accepted ones.
          scan "$GRYPE_IMAGE" sbom:/out/image.cdx.json -c /grype.yaml -q \
            -o json=/out/vulnerabilities.json -o table=/out/vulnerabilities.txt
          {
            echo "### Vulnerabilities in the image"
            echo "| Severity | Findings | With fix |"
            echo "|---|---|---|"
            jq -r '.matches | group_by(.vulnerability.severity) | .[]
              | "| \(.[0].vulnerability.severity) | \(length) | \(map(select(.vulnerability.fix.state == "fixed")) | length) |"' \
              sbom/vulnerabilities.json
            echo "Accepted in .grype.yaml: $(jq '.ignoredMatches | length' sbom/vulnerabilities.json)"
          } >> "$GITHUB_STEP_SUMMARY"

          # Gate: High or Critical findings with a fixed version fail the job.
          scan "$GRYPE_IMAGE" sbom:/out/image.cdx.json -c /grype.yaml -q --only-fixed --fail-on high
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-and-vulnerabilities
          path: sbom/
          if-no-files-found: ignore
      - name: Push to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE" "$repository:$GITHUB_SHA"
          docker push "$repository:$GITHUB_SHA"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$repository:$GITHUB_SHA")"
          echo "Published \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
