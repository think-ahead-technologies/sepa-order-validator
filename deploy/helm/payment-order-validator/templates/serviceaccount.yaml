# ABOUTME: Dedicated ServiceAccount for the validator pods; it carries no token because the app never calls the API.
# ABOUTME: Leader election runs on PostgreSQL locks (baseline design A5), so no Kubernetes RBAC is needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pov.fullname" . }}
  labels:
    {{- include "pov.labels" . | nindent 4 }}
automountServiceAccountToken: false
