logging:
  structured:
    format:
      console: ecs
    json:
      customizer: dev.thinkahead.sepa.LogMasking

spring:
  application:
    name: payment-order-validator
  threads:
    virtual:
      enabled: true
  modulith:
    events:
      republish-outstanding-events-on-restart: true

sepa:
  sftp:
    port: 22
    inbound-directory: inbound
    processing-directory: processing
    processed-directory: processed
    outbound-directory: outbound
    poll-interval: PT5S
  intake:
    max-file-size: 100MB
    reply-overdue-after: PT10M
    reply-check-interval: PT1M
  events:
    resubmit-after: PT5M
    resubmit-interval: PT1M
  leader-election:
    lock-time-to-live: PT10S
    heartbeat: PT1S

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
