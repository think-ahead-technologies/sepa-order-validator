logging:
  structured:
    format:
      console: ecs
    json:
      customizer: dev.thinkahead.sepa.LogMasking

spring:
  application:
    name: payment-order-validator
  threads:
    virtual:
      enabled: true
  modulith:
    events:
      # Events only notify; processing runs on the work queue (spec file-processing). Nothing is republished on restart, and
      # completed publications are not kept.
      republish-outstanding-events-on-restart: false
      completion-mode: delete

sepa:
  sftp:
    port: 22
    inbound-directory: inbound
    # SEPA Instant inbox, processed with priority; blank disables it until the directory exists on the SFTP server
    instant-inbound-directory:
    processing-directory: processing
    processed-directory: processed
    outbound-directory: outbound
    staging-directory: staging
    poll-interval: PT5S
    timeout: PT30S
  intake:
    max-file-size: 100MB
    reply-overdue-after: PT10M
    reply-check-interval: PT1M
  processing:
    retention: P7D
    housekeeping-interval: PT1H
    validate:
      workers: 2
      lease: PT10M
      timeout: PT5M
      max-attempts: 3
      poll-interval: PT1S
      initial-backoff: PT10S
      max-backoff: PT1M
    report:
      workers: 2
      lease: PT2M
      timeout: PT1M
      max-attempts: 10
      poll-interval: PT1S
      initial-backoff: PT10S
      max-backoff: PT10M
    deliver:
      workers: 2
      lease: PT2M
      timeout: PT1M
      max-attempts: 10
      poll-interval: PT1S
      initial-backoff: PT10S
      max-backoff: PT10M
  leader-election:
    lock-time-to-live: PT10S
    heartbeat: PT1S

management:
  # OTLP export (spec observability): logs and traces once OTEL_EXPORTER_OTLP_ENDPOINT is set; metrics additionally
  # need OTEL_METRICS_EXPORTER=otlp, because the OTLP meter registry would otherwise push to localhost.
  otlp:
    metrics:
      export:
        enabled: false
        # same metric names as on /actuator/prometheus, whichever way metrics are collected
        base-time-unit: seconds
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        # sbom serves the CycloneDX SBOM embedded in the jar; port 8080 stays cluster-internal (no route to /actuator)
        include: health,prometheus,sbom
  endpoint:
    health:
      probes:
        enabled: true
