spring:
  application:
    name: payment-order-validator
  threads:
    virtual:
      enabled: true
  modulith:
    events:
      republish-outstanding-events-on-restart: true

sepa:
  sftp:
    port: 22
    inbound-directory: inbound
    processed-directory: processed
    outbound-directory: outbound
    poll-interval: PT5S
  leader-election:
    lock-time-to-live: PT10S
    heartbeat: PT1S
