logging:
  structured:
    format:
      console: ecs
    json:
      customizer: dev.thinkahead.sepa.LogMasking

spring:
  application:
    name: payment-order-validator
  threads:
    virtual:
      enabled: true
  modulith:
    events:
      # A listener run interrupted by a crash stays PROCESSING; once stale it is marked FAILED and resubmitted by
      # FailedEventResubmission. Republishing on restart is off: it would also rerun work in progress on other
      # live instances during every rolling deploy. Stale must exceed the longest listener run.
      republish-outstanding-events-on-restart: false
      staleness:
        processing: PT5M

sepa:
  sftp:
    port: 22
    inbound-directory: inbound
    processing-directory: processing
    processed-directory: processed
    outbound-directory: outbound
    staging-directory: staging
    poll-interval: PT5S
  intake:
    max-file-size: 100MB
    reply-overdue-after: PT10M
    reply-check-interval: PT1M
  events:
    resubmit-after: PT5M
    resubmit-interval: PT1M
  processing:
    validate:
      workers: 2
      lease: PT10M
      timeout: PT5M
      max-attempts: 3
      poll-interval: PT1S
      initial-backoff: PT10S
      max-backoff: PT1M
    deliver:
      workers: 2
      lease: PT2M
      timeout: PT1M
      max-attempts: 10
      poll-interval: PT1S
      initial-backoff: PT10S
      max-backoff: PT10M
  leader-election:
    lock-time-to-live: PT10S
    heartbeat: PT1S

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
