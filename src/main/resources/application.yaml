logging:
  structured:
    format:
      console: ecs
    json:
      customizer: dev.thinkahead.sepa.LogMasking

spring:
  application:
    name: payment-order-validator
  threads:
    virtual:
      enabled: true
  modulith:
    events:
      # Events only notify; processing runs on the work queue (ADR-0017). Nothing is republished on restart, and
      # completed publications are not kept.
      republish-outstanding-events-on-restart: false
      completion-mode: delete

sepa:
  sftp:
    port: 22
    inbound-directory: inbound
    # SEPA Instant inbox, processed with priority; blank disables it until the directory exists on the SFTP server
    instant-inbound-directory:
    processing-directory: processing
    processed-directory: processed
    outbound-directory: outbound
    staging-directory: staging
    poll-interval: PT5S
    timeout: PT30S
  intake:
    max-file-size: 100MB
    reply-overdue-after: PT10M
    reply-check-interval: PT1M
  processing:
    retention: P7D
    housekeeping-interval: PT1H
    validate:
      workers: 2
      lease: PT10M
      timeout: PT5M
      max-attempts: 3
      poll-interval: PT1S
      initial-backoff: PT10S
      max-backoff: PT1M
    report:
      workers: 2
      lease: PT2M
      timeout: PT1M
      max-attempts: 10
      poll-interval: PT1S
      initial-backoff: PT10S
      max-backoff: PT10M
    deliver:
      workers: 2
      lease: PT2M
      timeout: PT1M
      max-attempts: 10
      poll-interval: PT1S
      initial-backoff: PT10S
      max-backoff: PT10M
  leader-election:
    lock-time-to-live: PT10S
    heartbeat: PT1S

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
